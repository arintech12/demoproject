name: C++ CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run build commands
        run: |
          echo "Running build stage..."
          exit 1
          # Add your actual build commands here
          mkdir build
          echo "Build complete" > build/status.txt

  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run deploy commands
        run: |
          echo "Running deploy stage..."
          # Add your actual deployment logic here
          cat build/status.txt || echo "No build artifact found"
          echo "Deployment complete"
