name: C++ CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # (Optional) Show GCC version
    - name: Show GCC version
      run: g++ --version

    # Build the project
    - name: Build hello_world.cpp
      run: |
        g++ hello_world.cpp -o hello_world
        ./hello_world
