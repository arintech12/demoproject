name: C++ CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    name: 🏗️ Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create build output
        run: |
          mkdir -p build
          echo "<!DOCTYPE html>" > build/index.html
          echo "<html><head><title>My App</title></head><body>" >> build/index.html
          echo "<h1>Hello from GitHub Actions 🚀</h1>" >> build/index.html
          echo "<p>Build at $(date)</p>" >> build/index.html
          echo "</body></html>" >> build/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/

  deploy:
    name: 🚀 Deploy Simulated
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Show HTML contents
        run: |
          echo "=== index.html ==="
          cat index.html

      - name: Do something useful (e.g. QA check)
        run: |
          echo "Checking for <title> tag..."
          if grep -q "<title>" index.html; then
            echo "✅ Valid HTML file."
          else
            echo "❌ Missing title tag!"
            exit 1
          fi
