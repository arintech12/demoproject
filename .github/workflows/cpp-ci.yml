name: C++ CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up C++ compiler (g++)
      - name: Set up C++ compiler
        run: sudo apt-get install g++

      # Step 3: Build the C++ code (compile main.cpp)
      - name: Build C++ code
        run: g++ hello_world.cpp -o hello-world

      # Step 4: Upload the build artifact (compiled binary)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-binary
          path: hello-world

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Make sure the build job is done before deploying
    steps:
      # Step 1: Download the build artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-world-binary

      # Step 2: Run the downloaded artifact to simulate deployment
      - name: Deploy hello-world binary
        run: ./hello-world
